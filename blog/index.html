<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Writing by Zhihao Wang — notes on infrastructure, platforms, and the work in between." />
  <title>blog — Zhihao Wang</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="blog — Zhihao Wang" />
  <meta property="og:description" content="Writing by Zhihao Wang — notes on infrastructure, platforms, and the work in between." />
  <meta property="og:url" content="https://zhihaowang.me/blog/" />
  <meta property="og:image" content="https://zhihaowang.me/resource/zhihao.JPG" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="blog — Zhihao Wang" />
  <meta name="twitter:description" content="Writing by Zhihao Wang — notes on infrastructure, platforms, and the work in between." />
  <link rel="canonical" href="https://zhihaowang.me/blog/" />

  <script>
    (function () {
      var t = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/resource/site.css" />
</head>
<body>
  <div id="progress-bar"></div>

  <nav>
    <div class="wrap">
      <div class="nav-inner">
        <a href="/" class="nav-brand"><span class="dim">~/</span>zhihao</a>
        <button class="mobile-btn" id="mobile-btn">[menu]</button>
        <div class="nav-links" id="nav-links">
          <a href="/">home</a>
          <a href="/blog/">blog</a>
          <button class="theme-btn" onclick="openCmd()" style="margin-right:0.25rem;">[/]</button>
          <button class="theme-btn" id="theme-btn">[theme]</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="wrap blog-page">
    <div class="prompt">
      <span class="ps1">zhihao@portfolio:~/blog$</span>
      <span class="cmd">ls</span>
      <span class="arg">-lt</span>
    </div>
    <p style="font-size:0.8rem; color:var(--dim); margin:0.4rem 0 1.5rem;">notes, in reverse chronological order.</p>

    <!--
      To add a post:
        1. Copy blog/_template/ to blog/<slug>/.
        2. Replace POST TITLE, your-slug, and YYYY-MM-DD in that copy.
        3. Add an entry below and in blog/posts.json.
        4. Link it from the homepage #blog section and the command palette.
    -->
    <p class="blog-empty">no posts yet.</p>
  </main>

  <div id="cmd-overlay">
    <div id="cmd-box">
      <div id="cmd-input-wrap">
        <span class="ps1">:~$</span>
        <input id="cmd-input" type="text" placeholder="jump to..." autocomplete="off" spellcheck="false" />
      </div>
      <div id="cmd-results"></div>
      <div id="cmd-hint">↑↓ navigate &nbsp;·&nbsp; enter select &nbsp;·&nbsp; esc close &nbsp;·&nbsp; press / to open</div>
    </div>
  </div>

  <footer class="wrap">
    <span>&copy; <span id="yr"></span> zhihao wang &nbsp;·&nbsp; <span class="tooltip-wrap" id="uptime-wrap" style="cursor:default;">
      <span id="uptime" style="border-bottom:1px dotted var(--faint);"></span>
      <span class="tooltip-box">time since starting 1st job (Aug 1, 2016)</span>
    </span>&nbsp;·&nbsp;<span id="visitor-count" style="border-bottom:1px dotted var(--faint);">visits: ...</span></span>
    <div class="footer-links">
      <a href="/blog/">blog</a>
      <a href="https://linkedin.com/in/zhihao-wang" target="_blank" rel="noopener">linkedin</a>
      <a href="https://github.com/wangzhihao0629" target="_blank" rel="noopener">github</a>
      <a href="/resource/zhihao-wang-resume.pdf" target="_blank" rel="noopener">resume</a>
    </div>
  </footer>

  <script src="/resource/site.js"></script>
</body>
</html>
